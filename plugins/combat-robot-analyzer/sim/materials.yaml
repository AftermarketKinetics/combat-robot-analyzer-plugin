# ══════════════════════════════════════════════════════════════════════════
# Hyperelastic (Ogden / Mooney-Rivlin)
# ══════════════════════════════════════════════════════════════════════════
#
# `law: ogden` maps to Radioss /MAT/OGDEN (Law 42). Parameters are the
# Ogden shear moduli (mu) and exponents (alpha). The solver computes the
# bulk modulus from Poisson's ratio internally; `bulk_modulus` below is
# only for the pipeline's timestep estimate.
#
# `law: mooney_rivlin` is sugar for Ogden Order=2 with alpha=[2,-2] and
# mu=[C10, -C01]. Use it when the datasheet gives C10/C01 (the most
# common published TPU characterisation format).
#
# Printed TPU wheels and tyres carry the same interlayer weakness as the
# rigid filaments, but LAW42 has no yield or failure term to knock down, so
# there is no `_z` card here: model the anisotropy by orienting the part so
# the layers are in shear, and treat any tearing prediction as unmodelled.

tpu_shore95a:                     # printed wheels, tyres, impact mounts
  law: ogden
  density: 1.15e-9
  poisson: 0.495
  mu: [0.382, -0.012]
  alpha: [1.3, -2.0]
  bulk_modulus: 2300          # for timestep estimate only

tpu_shore85a:                     # softer tread, grip over durability
  law: mooney_rivlin
  density: 1.13e-9
  poisson: 0.495
  c10: 0.22
  c01: 0.055
  bulk_modulus: 1100

tpu_shore80a:
  law: mooney_rivlin
  density: 1.12e-9
  poisson: 0.495
  c10: 0.155
  c01: 0.038
  bulk_modulus: 800

tpu_shore60d:                     # stiff TPU — hubs, sprockets, semi-rigid armour
  law: ogden
  density: 1.20e-9
  poisson: 0.49
  mu: [1.60, -0.05]
  alpha: [1.5, -2.0]
  bulk_modulus: 4000

silicone_60a:
  law: mooney_rivlin
  density: 1.10e-9
  poisson: 0.499
  c10: 0.08
  c01: 0.02


# ══════════════════════════════════════════════════════════════════════════
# Orthotropic shells (FABRI / Law 19)
# ══════════════════════════════════════════════════════════════════════════
#
# `law: fabric` maps to Radioss /MAT/FABRI (Law 19) — a simple orthotropic
# elastic shell.  Requires /PROP/SH_ORTH (TYPE9) property, emitted
# automatically for quad/tri elements.  No built-in yield or failure
# criterion; use a `failure:` block for element erosion.
#
# Use these for thin-shell (quad/tri) composite parts.  For thick-shell
# composites with Tsai-Wu failure, see the COMPSH entries below.

carbon_ud_t700_shell:
  law: fabric
  density: 1.58e-9
  e11: 135000
  e22: 10000
  nu12: 0.30
  g12: 5000
  g23: 3800
  g31: 5000

eglass_woven_7781_shell:
  law: fabric
  density: 1.99e-9
  e11: 25000
  e22: 25000
  nu12: 0.12
  g12: 4000
  g23: 3000
  g31: 3000

nylon_ccf_shell:                  # continuous carbon fibre in nylon (Markforged class)
  law: fabric
  density: 1.40e-9
  e11: 54000                # fibre direction — printed laminate, not autoclave
  e22: 3000                 # matrix-dominated; nylon, so genuinely weak
  nu12: 0.30
  g12: 1500
  g23: 1000
  g31: 1500


# ══════════════════════════════════════════════════════════════════════════
# Orthotropic composites (COMPSH / Law 25)
# ══════════════════════════════════════════════════════════════════════════
#
# `law: compsh` maps to Radioss /MAT/COMPSH (Law 25) with Tsai-Wu failure
# criterion.  Requires hexahedral elements with a `layup:` block for
# composite thick-shell (TSH_COMP) properties.  NOT compatible with
# thin-shell quad/tri elements — use `law: fabric` variants above instead.
#
# Elastic constants: e11 (fibre), e22 (transverse), nu12, g12, g23, g31.
# Yield stresses: sigma_1yt/1yc (tension/compression dir 1), sigma_2yt/2yc.
# Optional failure strains: eps_f1, eps_f2, dmax.

carbon_ud_t700:
  law: compsh
  density: 1.58e-9
  e11: 135000               # MPa (fibre direction)
  e22: 10000                # MPa (transverse)
  nu12: 0.30
  g12: 5000
  g23: 3800
  g31: 5000
  sigma_1yt: 2200           # tension dir 1
  sigma_2yt: 50
  sigma_1yc: 1500           # compression dir 1
  sigma_2yc: 200
  eps_f1: 0.015
  eps_f2: 0.015
  dmax: 0.999

eglass_woven_7781:
  law: compsh
  density: 1.99e-9
  e11: 25000                # balanced weave
  e22: 25000
  nu12: 0.12
  g12: 4000
  g23: 3000
  g31: 3000
  sigma_1yt: 440
  sigma_2yt: 440
  sigma_1yc: 400
  sigma_2yc: 400


# ══════════════════════════════════════════════════════════════════════════
# Stand-ins
# ══════════════════════════════════════════════════════════════════════════

# Rigid-ish elastic stand-in for anvils, strikers and fixtures.
steel_elastic:
  law: elastic
  density: 7.85e-9
  young: 205000
  poisson: 0.30

# The arena floor / a rigid opponent: stiff, heavy, no plasticity to muddy
# the energy balance. Pair with a `contact:` block.
arena_floor_elastic:
  law: elastic
  density: 7.85e-9
  young: 210000
  poisson: 0.30
