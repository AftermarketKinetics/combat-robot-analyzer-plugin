# ══════════════════════════════════════════════════════════════════════════
# Printed thermoplastics (FDM)
# ══════════════════════════════════════════════════════════════════════════
# Interlayer strength is set by the bead weld, not the bulk polymer, so each
# material comes as an `_xy` / `_z` pair. Use `_z` whenever the peak tensile
# principal stress runs normal to the layers; run both to bracket an unknown
# build orientation.
#
#   material      k_sigma (Z/XY)   k_E    k_eps    why
#   PLA+          0.50 (.45-.60)   0.90   0.20     fast vitrification, poor reptation
#   PETG          0.72 (.65-.80)   0.92   0.25     amorphous, wide soft window
#   PA12 FDM      0.55 (.45-.65)   0.90   0.20     crystallises before the weld coalesces
#   PA12 SLS      0.90 (.85-.95)   0.97   0.45     powder bed near Tm — near isotropic
#   PA6-CF        0.45 (.40-.55)   0.55   0.15     chopped fibre aligns IN-PLANE only
#
# Chopped-fibre grades are the most anisotropic of the lot: the fibres
# reinforce XY and contribute nothing across a layer boundary, so filling a
# nylon with carbon raises XY stiffness and makes the Z ratio worse.
#
# Two things these cards do NOT model: the section is solid, so infill and
# wall count remain your problem; and the knockdown is a tension knockdown —
# welds carry compression nearly as well as bulk polymer, so a `_z` card is
# over-conservative on the compression side of a bending section.
#
# Densities are the solid polymer. `strain_rate_eps0: 1.0e-3` is the ISO 527
# test rate the A/B terms were read at, so the rate term is zero at test
# conditions. Those rate terms are unfiltered, so either set
# `strain_rate_filter: 1` with an `f_cut` (see the header) or drop them
# for a conservative first run.

pla_plus_xy:                      # [HB] toughened PLA, in-plane
  law: johnson_cook
  density: 1.24e-9
  young: 3000
  poisson: 0.36
  yield: 40
  hardening_b: 45
  hardening_n: 0.50   # ~50 MPa at eps_p 0.05
  eps_max: 0.05
  sig_max: 55
  strain_rate_c: 0.035
  strain_rate_eps0: 1.0e-3

pla_plus_z:                       # [HB] interlayer: brittle, almost no drawing
  law: johnson_cook
