# Material library, in the mm_Mg_s consistent unit system:
#   length mm | mass Mg (tonne) | time s | stress MPa | density Mg/mm^3 | force N
#
# `law: johnson_cook` maps to Radioss LAW2, where flow stress is
#   sigma = (a + b * eps_p^n) * (1 + c * ln(eps_dot/eps_dot_0))
# so `yield` is the JC "A" term. Rate terms are optional; omit them for a
# rate-independent run.
#
# Rate terms come unfiltered: explicit dynamics feeds LAW2 the raw element
# strain rate, whose noise inflates the flow stress, and the starter says so
# (warning 1220). A sensible cutoff depends on the mesh and timestep rather
# than the material, so it is not baked into these entries — add it per model:
#   strain_rate_filter: 1     # Fsmooth
#   f_cut: 100000             # Hz; ~1/(10*dt) is a reasonable starting point
#
# Include this into a spec with the `materials:` key, or copy the entries you
# need. Values are handbook-typical, not certified — check them against your
# actual stock before trusting a result quantitatively.
#
# ── Provenance ──
#   [JC]  a published Johnson-Cook fit (Johnson & Cook 1983/85, Lesuer 2000,
#         and the usual ballistic literature). Trust these at impact rates.
#   [HB]  handbook-derived: A is the 0.2% offset yield, B and n fitted so the
#         curve passes through UTS at the tabulated elongation. Fine for
#         deformation and stiffness; treat rate and failure with suspicion.
#
# ── Naming ──
#   Printed (FDM) polymers come in `_xy` / `_z` pairs: `_xy` is in-plane
#   (beads loaded along their length), `_z` carries the interlayer knockdown
#   for tension normal to the layers. See the FDM section for the factors.
#
# ── Sections ──
#   aluminium · steel · abrasion-resistant plate · stainless · titanium
#   stock thermoplastics · printed thermoplastics · hyperelastics
#   orthotropic shells (FABRI) · orthotropic composites (COMPSH) · stand-ins


